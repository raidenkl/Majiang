plugins {
    id 'com.android.application'
}

/*
 *  版本号从仓库根的 package.json 读，与 Web 端 / 桌面版保持同一个来源。
 *  versionCode 由 x.y.z 折算：x*10000 + y*100 + z（2.5.5 → 20505）。
 *  安卓要求 versionCode 单调递增，所以版本号只能往上走。
 */
def pkgJson = new groovy.json.JsonSlurper().parse(new File(rootDir, '../package.json'))
def verName = (pkgJson.version ?: '0.0.0').toString()
def verNums = verName.tokenize('.').collect { it.replaceAll(/\D.*$/, '') as int }
def verCode = (verNums[0] ?: 0) * 10000 + (verNums[1] ?: 0) * 100 + (verNums[2] ?: 0)

/*
 *  签名
 *
 *  默认用仓库里那把固定的「开发密钥」android/signing/majiang-release.p12。
 *  为什么要放进仓库：CI runner 每次都是全新的，AGP 自动生成的 debug 密钥
 *  每次都不一样 → 用户无法覆盖安装新包；而本机没有 JDK / Android Studio，
 *  也没法离线生成一把。代价与注意事项见 android/signing/README.md。
 *
 *  想换成自己的密钥：配好仓库 secrets
 *  （ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS /
 *   ANDROID_KEY_PASSWORD），CI 会解出 keystore 并通过环境变量传进来，优先于默认值。
 */
def devKeystore = new File(rootDir, 'signing/majiang-release.p12')
def ksPath   = System.getenv('ANDROID_KEYSTORE_PATH')
                   ?: (devKeystore.exists() ? devKeystore.path : null)
def ksStore  = System.getenv('ANDROID_STORE_PASSWORD') ?: 'majiang-release'
def ksAlias  = System.getenv('ANDROID_KEY_ALIAS')      ?: 'majiang'
def ksKeyPwd = System.getenv('ANDROID_KEY_PASSWORD')   ?: ksStore

android {
    namespace 'com.raidenkl.majiang'
    compileSdk 34

    defaultConfig {
        applicationId 'com.raidenkl.majiang'
        minSdk 23
        targetSdk 34
        versionCode verCode
        versionName verName
    }

    signingConfigs {
        if (ksPath) {
            release {
                storeFile     file(ksPath)
                storeType     'PKCS12'
                storePassword ksStore
                keyAlias      ksAlias
                keyPassword   ksKeyPwd
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksPath) signingConfig signingConfigs.release
        }
        debug {
            /* debug 包也签同一个名，免得"换台机器就装不上覆盖包" */
            if (ksPath) signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false     // assembleRelease 不必跑 lintVital，免得小问题挡住出包
        abortOnError   false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/*
 *  把仓库根目录的 dist/ 复制进 APK 的 assets/www —— 「单机对局」离线用的资源。
 *  dist/ 是构建产物（未入库），所以每次构建都重新复制一份。
 */
def webDist = new File(rootDir, '../dist')

tasks.register('copyWebAssets', Copy) {
    doFirst {
        if (! webDist.isDirectory()) {
            throw new GradleException(
                "找不到 ${webDist}。请先在仓库根目录执行：npm install && npm run build")
        }
    }
    from(webDist) { into 'www' }
    into "$projectDir/src/main/assets"
}

/* 保证在合并 assets 之前把 www 准备好（preBuild + merge*Assets 双保险） */
tasks.matching {
    it.name == 'preBuild'
            || (it.name.startsWith('merge') && it.name.endsWith('Assets'))
}.configureEach {
    dependsOn 'copyWebAssets'
}
