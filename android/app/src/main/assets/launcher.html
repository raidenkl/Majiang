<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電脳麻将</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #111; color: #eee;
    font-family: system-ui, -apple-system, "Noto Sans SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; gap: 10px;
    padding: 10px 14px;
  }
  header { display: flex; align-items: baseline; gap: 10px; flex: 0 0 auto; }
  h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  .tag { font-size: 12px; color: #888; }
  main {
    flex: 1 1 auto; min-height: 0;
    display: grid; gap: 12px; grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 620px) { main { grid-template-columns: 1fr; } }
  section {
    border: 1px solid #333; border-radius: 10px; background: #1a1a1a;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    min-height: 0; overflow: auto;
  }
  h2 { font-size: 16px; margin: 0; font-weight: 600; }
  p { margin: 0; font-size: 13px; line-height: 1.5; color: #999; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1 1 auto; min-width: 0;
    background: #0d0d0d; color: #eee;
    border: 1px solid #444; border-radius: 6px;
    padding: 9px 12px; font-size: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  input:focus { outline: none; border-color: #d94a3d; }
  button {
    border: 0; border-radius: 6px; cursor: pointer; color: #fff;
    font-size: 15px; padding: 10px 16px; background: #3a3a3a;
    font-family: inherit; white-space: nowrap;
  }
  button:active { filter: brightness(.85); }
  button.primary { background: #b93b2f; }
  button.join    { background: #2f6fb9; }
  .err { color: #ff8b7d; font-size: 13px; min-height: 1.2em; }
  .grow { flex: 1 1 auto; }
</style>
</head>
<body>

  <header>
    <h1>電脳麻将</h1>
    <span class="tag">Android 版 · 建议横屏</span>
  </header>

  <main>

    <section>
      <h2>单机对局</h2>
      <p>和 AI 对局，完全离线，不需要联网。</p>
      <div class="grow"></div>
      <button class="primary" id="solo">开始单机对局</button>
    </section>

    <section>
      <h2>局域网联机</h2>
      <p>输入开着「主机」的那台设备的地址（需连同一个 WiFi）。</p>
      <div class="row">
        <input id="host" type="text" inputmode="url" placeholder="192.168.1.5"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="join" id="join">连接</button>
      </div>
      <p class="err" id="err"></p>
      <p>主机要先在浏览器里打开游戏，点「ネット対戦」→「局域网联机」开启，
         页面上会显示邀请地址。地址变了随时改这里重新连接。</p>
    </section>

  </main>

  <script src="host-input.js"></script>
  <script>
  (function () {
    var KEY   = 'majiang.host';
    var $host = document.getElementById('host');
    var $err  = document.getElementById('err');

    /* 记住上次的主机地址：优先用原生 SharedPreferences（file:// 下更可靠），
       没有原生桥时退回 localStorage（方便在浏览器里调试这个页面） */
    function loadHost() {
      try { if (window.MajiangHost) return MajiangHost.getHost() || ''; } catch (e) {}
      try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; }
    }
    function saveHost(v) {
      try { if (window.MajiangHost) MajiangHost.setHost(v); } catch (e) {}
      try { localStorage.setItem(KEY, v); } catch (e) {}
    }

    $host.value = loadHost();

    document.getElementById('solo').addEventListener('click', function () {
      location.href = 'www/index.html';
    });

    function join() {
      var url = normalizeHost($host.value);
      if (! url) {
        $err.textContent = '地址看不懂，示例：192.168.1.5 或 192.168.1.5:8080';
        $host.focus();
        return;
      }
      $err.textContent = '正在连接 ' + url;
      saveHost(url);
      /* 顶层导航到主机 —— origin 变成主机本身，登录/socket/跳转才能按原样工作 */
      location.href = url;
    }

    document.getElementById('join').addEventListener('click', join);
    $host.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) join();
    });
  })();
  </script>

</body>
</html>
