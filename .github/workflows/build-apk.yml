name: build-apk

# develop / master 有推送就出一个 APK；打 tag 时把它追加到该 tag 的 Release
# （与 build-sea.yml 建的同一个 Release 合并，softprops 在 Release 已存在时是追加资产）。
on:
  workflow_dispatch:
  push:
    branches: [ 'develop', 'master' ]
    tags:     [ 'v*' ]

permissions:
  contents: write          # tag 时把 APK 附到 Release 需要写权限

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) 先建 Web 产物 —— APK 内置的「离线单机」资源就是 dist/
      #    （dist/ 未入库，必须在这里现场生成）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build web dist
        run: |
          npm ci
          npm run build

      # 2) JDK 17（AGP 8 需要）。Android SDK 用 runner 预装的那份：
      #    ANDROID_HOME 已就绪、许可已接受，缺的 platform/build-tools
      #    交给 AGP 自动补装（所以不需要 android-actions/setup-android）。
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --version
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # 3) 出包：注入了签名密钥就出 release 包，否则出可直接安装的 debug 包
      - name: Assemble APK
        id: assemble
        working-directory: android
        env:
          KS_B64:                 ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew          # Windows 上提交的脚本没有可执行位
          LOG="$RUNNER_TEMP/gradle.log"
          if [ -n "${KS_B64:-}" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "::notice::使用 secrets 里的签名密钥"
          else
            echo "::notice::使用仓库内固定开发密钥 android/signing/majiang-release.p12"
          fi
          ./gradlew --no-daemon assembleRelease 2>&1 | tee "$LOG"

      # 4) 出包成功后挑 APK，并把签名证书指纹打出来（便于核对「覆盖安装」是否可行）
      - name: Collect APK
        if: success()
        working-directory: android
        run: |
          set -eu
          SRC=app/build/outputs/apk/release/app-release.apk
          mkdir -p ../artifact
          cp "$SRC" ../artifact/Majiang-android.apk
          ls -l ../artifact
          echo "=== 签名证书 ==="
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
              ../artifact/Majiang-android.apk | tee "$RUNNER_TEMP/sig.txt"
          grep -m1 'certificate DN'               "$RUNNER_TEMP/sig.txt" | sed 's/^/::notice::/' || true
          grep -m1 'SHA-256 digest'               "$RUNNER_TEMP/sig.txt" | sed 's/^/::notice::/' || true

      # 5) 失败时把 Gradle 日志尾部转成 annotation（公开仓库用 API 就能读到）
      - name: Dump gradle log tail as annotations
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::没有 gradle 日志文件（失败发生在 Assemble 之前）"
            exit 0
          fi
          echo "::error::===== gradle 日志尾部 ====="
          tail -n 45 "$LOG" | while IFS= read -r line; do
            printf '::error::%s\n' "${line:0:380}"
          done
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: majiang-android
          path: artifact/

      # 6) tag 时附到该 tag 的 Release
      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/Majiang-android.apk
