name: build-sea

on:
  workflow_dispatch:          # 仓库 Actions 页点“Run workflow”手动触发
  push:
    tags: ['v*']              # 推送 v* 标签自动触发

# 创建 GitHub Release / 上传资产需要写权限；默认 GITHUB_TOKEN 是只读，会 403
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'                # ≥25.5 才有 --build-sea
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-sea/package-lock.json

      # 1) 重新生成 dist 的 HTML/CSS/JS（这些被 .gitignore 排除，不在仓库里）
      - name: Build web dist
        run: |
          npm ci
          npm run build

      # 2) 打包 dist.zip（纯 Node 脚本，双平台通用）
      - name: Pack dist.zip
        working-directory: desktop-sea
        run: node build.js

      # 2.5) 打包网络对战服务器为单文件（SEA main 脚本）
      - name: Build netplay server bundle
        run: npm run build:server

      # 3) 用 --build-sea 生成单文件可执行程序
      #    CI 里刻意用 ASCII 输出名：避免中文文件名在 Windows Git Bash / shell 步骤的编码坑
      - name: Build SEA executable
        shell: node {0}
        working-directory: desktop-sea
        run: |
          const fs = require('fs'), cp = require('child_process');
          const isWin = process.platform === 'win32';
          const out = isWin ? 'majiang-sea.exe' : 'majiang-sea';
          fs.writeFileSync('sea-build-config.json', JSON.stringify({
            main: 'server-bundle.cjs', output: './' + out,
            disableExperimentalSEAWarning: true,
            useCodeCache: false, useSnapshot: false,
            assets: { dist: 'dist.zip' }
          }, null, 2));
          cp.execFileSync(process.execPath, ['--build-sea', 'sea-build-config.json'], { stdio: 'inherit' });

      # 4) 冒烟测试：
      #    a. 轮询等待 sea-url.txt 出现且端口可达（最多 20s，避免冷 runner 时序竞态）
      #    b. 校验 sea-source.txt 含“SEA 内嵌资源”
      #       注意：CI 工作目录里 ../dist 也存在，所以仅凭 HTTP 200 无法区分是否为真 SEA 注入
      #    这两个 txt 现在是 opt-in：只有 MAJIANG_WRITE_STATUS=1 时才会落盘
      #    （默认不写，免得用户双击 exe 时旁边多出两个文件）
      - name: Smoke test (verify SEA injection)
        shell: bash
        working-directory: desktop-sea
        run: |
          if [ -f majiang-sea.exe ]; then BIN=majiang-sea.exe; else BIN=majiang-sea; fi
          MAJIANG_WRITE_STATUS=1 "./$BIN" > smoke.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 20); do
            if [ -s sea-url.txt ] && curl -sf "$(cat sea-url.txt)" >/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          [ "$ok" -eq 1 ] || { echo "服务器未在 20s 内就绪:"; cat smoke.log; kill $PID 2>/dev/null; exit 1; }
          grep -q "SEA 内嵌资源" sea-source.txt \
            || { echo "非 SEA 注入(可能回退到了 dist 目录):"; cat smoke.log; kill $PID 2>/dev/null; exit 1; }
          # 内嵌的是完整对战服务器:验证 /local/lan 接口可用
          curl -sf "$(cat sea-url.txt)local/lan" | grep -q '"enabled"' \
            || { echo "内嵌对战服务器异常(/local/lan 不可用):"; kill $PID 2>/dev/null; exit 1; }
          echo "冒烟测试通过: 资源来源 = $(cat sea-source.txt), URL = $(cat sea-url.txt)"
          kill $PID 2>/dev/null || true

      # 5) 收集为 ASCII 名产物（最终下载名）
      - name: Collect artifact
        shell: node {0}
        working-directory: desktop-sea
        run: |
          const fs = require('fs');
          const isWin = process.platform === 'win32';
          fs.mkdirSync('../artifact', { recursive: true });
          fs.copyFileSync(isWin ? 'majiang-sea.exe' : 'majiang-sea',
                          isWin ? '../artifact/Majiang-windows-x64.exe'
                                : '../artifact/Majiang-linux-x64');

      # 6) 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: majiang-${{ matrix.os }}
          path: artifact/

  # 单独的发布 job：等两个平台 build 都完成，把两平台产物合成一个 Release
  # （避免每个 matrix job 各自创建 release 的并发竞争；只创建一次）
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          # draft: true   # 如需“先创建草稿、人工确认后再发布”，取消这行注释
