name: build-sea

on:
  workflow_dispatch:          # 仓库 Actions 页点“Run workflow”手动触发
  push:
    tags: ['v*']              # 推送 v* 标签自动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'                # ≥25.5 才有 --build-sea
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            desktop-sea/package-lock.json

      # 1) 重新生成 dist 的 HTML/CSS/JS（这些被 .gitignore 排除，不在仓库里）
      - name: Build web dist
        run: |
          npm ci
          npm run build

      # 2) 打包 dist.zip（纯 Node 脚本，双平台通用）
      - name: Pack dist.zip
        working-directory: desktop-sea
        run: node build.js

      # 3) 用 --build-sea 生成单文件可执行程序（node 写配置，正确处理平台输出名）
      - name: Build SEA executable
        shell: node {0}
        working-directory: desktop-sea
        run: |
          const fs = require('fs'), cp = require('child_process');
          const isWin = process.platform === 'win32';
          const out = isWin ? '電脳麻将.exe' : '電脳麻将';
          fs.writeFileSync('sea-build-config.json', JSON.stringify({
            main: 'server.js', output: './' + out,
            disableExperimentalSEAWarning: true,
            useCodeCache: false, useSnapshot: false,
            assets: { dist: 'dist.zip' }
          }, null, 2));
          cp.execFileSync(process.execPath, ['--build-sea', 'sea-build-config.json'], { stdio: 'inherit' });

      # 4) 复制成 ASCII 名，避免中文名在 artifact 的兼容问题
      - name: Collect artifact
        shell: node {0}
        working-directory: desktop-sea
        run: |
          const fs = require('fs');
          const isWin = process.platform === 'win32';
          fs.mkdirSync('../artifact', { recursive: true });
          fs.copyFileSync(isWin ? '電脳麻将.exe' : '電脳麻将',
                          isWin ? '../artifact/Majiang-windows-x64.exe'
                                : '../artifact/Majiang-linux-x64');

      # 5) 冒烟测试：日志必须出现“资源来源: SEA 内嵌资源”（证明注入成功，否则构建判红）
      - name: Smoke test (verify SEA injection)
        shell: bash
        working-directory: desktop-sea
        run: |
          BIN="[ -f 電脳麻将.exe ] && echo 電脳麻将.exe || echo 電脳麻将"
          "./$(eval $BIN)" > smoke.log 2>&1 &
          sleep 4
          curl -sf http://127.0.0.1:8080/ >/dev/null || curl -sf http://127.0.0.1:8081/ >/dev/null
          grep -q "资源来源: SEA 内嵌资源" smoke.log

      # 6) 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: majiang-${{ matrix.os }}
          path: artifact/

      # 7)（可选）打 v* 标签时顺便发布 Release 附带两平台产物
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/*